<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH · {{ cred.engine_name }}/node-{{ cred.node_id }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='xterm/xterm.css') }}" rel="stylesheet">
    <style>
        /* Lock the whole page to the viewport — the terminal fits inside;
           only xterm's own viewport scrolls (scrollback), never the page.
           This is what keeps the SSH window proportioned to the browser
           window instead of overflowing and forcing a page scroll. */
        html, body { height: 100%; }
        body {
            margin: 0; padding: 0; background: #0d1117;
            height: 100vh; display: flex; flex-direction: column;
            overflow: hidden;
        }
        .term-bar {
            background: #161b22; color: #c9d1d9; padding: 0.4rem 0.8rem;
            border-bottom: 1px solid #30363d; display: flex; gap: 1rem;
            align-items: center; font-size: 0.82rem;
            flex: 0 0 auto;
        }
        .term-bar .badge { font-size: 0.7rem; }
        .term-bar .status { margin-left: auto; }
        /* flex:1 fills the remaining height; min-height:0 lets it shrink
           inside the flex column; overflow:hidden so the container itself
           never scrolls (xterm manages its own internal viewport). */
        #terminal { flex: 1 1 auto; padding: 0.4rem; min-height: 0; overflow: hidden; }
        #terminal .xterm,
        #terminal .xterm-screen { height: 100%; }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
        .status-connecting { background: #f0b400; }
        .status-open       { background: #2ea043; }
        .status-closed     { background: #f85149; }
    </style>
</head>
<body>
    <div class="term-bar">
        <span><i class="bi bi-terminal-fill"></i></span>
        <strong>{{ cred.engine_name }}</strong>
        <span class="badge bg-secondary">node {{ cred.node_id }}</span>
        <code style="color:#8b949e;">{{ cred.ssh_username }}@{{ cred.hostname }}:{{ cred.ssh_port or 22 }}</code>
        <span class="status">
            <span id="statusDot" class="status-dot status-connecting"></span>
            <span id="statusText">connecting…</span>
        </span>
    </div>
    <div id="terminal"></div>

    <script src="{{ url_for('static', filename='xterm/xterm.js') }}"></script>
    <script src="{{ url_for('static', filename='xterm/xterm-addon-fit.js') }}"></script>
    <script>
        (function () {
            const term = new Terminal({
                cursorBlink: true,
                fontSize: 13,
                fontFamily: '"SFMono-Regular","Menlo","Consolas",monospace',
                theme: { background: '#0d1117', foreground: '#c9d1d9' },
            });
            const fitAddon = new FitAddon.FitAddon();
            term.loadAddon(fitAddon);
            term.open(document.getElementById('terminal'));

            const dot  = document.getElementById('statusDot');
            const txt  = document.getElementById('statusText');
            function setStatus(state, label) {
                dot.className = 'status-dot status-' + state;
                txt.textContent = label;
            }

            // flask-sock's url_for returns either an absolute ws:// URL or a
            // bare path depending on Flask's preferred_url_scheme + the request
            // context. Handle both: if absolute, use as-is; if relative, prefix.
            const wsRaw = {{ ws_path|tojson }};
            const proto = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            const wsUrl = /^wss?:\/\//i.test(wsRaw)
                ? wsRaw
                : proto + window.location.host + wsRaw;
            const ws = new WebSocket(wsUrl);
            ws.binaryType = 'arraybuffer';

            ws.onopen = function () {
                setStatus('open', 'connected');
                // Fit + report geometry on connect — covers the case where
                // the socket opens before the first layout-driven fit.
                doFit();
            };
            ws.onmessage = function (ev) {
                if (typeof ev.data === 'string') {
                    term.write(ev.data);
                } else {
                    term.write(new Uint8Array(ev.data));
                }
            };
            ws.onclose = function (ev) {
                setStatus('closed', 'disconnected' + (ev.reason ? ' — ' + ev.reason : ''));
                term.write('\r\n\x1b[33m*** Session closed ***\x1b[0m\r\n');
            };
            ws.onerror = function () {
                setStatus('closed', 'error');
            };

            term.onData(function (data) {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(data);
                }
            });

            function sendResize() {
                if (ws.readyState !== WebSocket.OPEN) return;
                const payload = JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows });
                ws.send('\x00' + payload);
            }

            // Fit the terminal to its container, then tell the remote PTY
            // the new geometry. Wrapped so the (rare) fit exception on a
            // zero-size container doesn't break the session.
            function doFit() {
                try { fitAddon.fit(); } catch (e) { /* container not laid out yet */ }
                sendResize();
            }

            // Initial sizing must wait for layout + web fonts: calling fit()
            // synchronously right after open() measures stale cell metrics
            // (before the monospace font loads) and overshoots the row count,
            // which is what made the SSH window overflow the browser window.
            requestAnimationFrame(doFit);
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(doFit).catch(function () {});
            }

            // Keep the terminal proportioned to its frame whenever the
            // window OR the container box changes size. ResizeObserver
            // catches cases a window 'resize' event misses (devtools dock,
            // zoom, flex reflow after the status bar wraps).
            if (window.ResizeObserver) {
                const ro = new ResizeObserver(function () { doFit(); });
                ro.observe(document.getElementById('terminal'));
            }
            window.addEventListener('resize', doFit);

            window.addEventListener('beforeunload', function () {
                try { ws.close(); } catch (e) {}
            });

            term.focus();
        })();
    </script>
</body>
</html>
